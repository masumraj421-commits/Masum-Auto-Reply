                        className="w-full text-xs sm:text-sm p-3 rounded-xl border border-slate-300 focus:outline-none focus:border-meta"
                      />
                    </div>
                  </div>

                  {/* Quick sample chips */}
                  <div className="flex flex-wrap gap-2 mb-6">
                    {(simType === 'messenger' ? [
                      'দাম কত ভাই?', 'ঢাকার বাইরে কি ডেলিভারি হবে?', 'আপনাদের শোরুমের ঠিকানা কোথায়?', 'অর্ডার করতে চাই'
                    ] : [
                      'Price please', 'পণ্যটি কি এখনও স্টকে আছে?', 'অনেক সুন্দর কালেকশন!', 'চট্টগ্রামে কুরিয়ার কত?'
                    ]).map(chip => (
                      <button 
                        key={chip} 
                        onClick={() => setSimText(chip)}
                        className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-2.5 py-1 rounded-lg border border-slate-200 transition-colors"
                      >
                        {chip}
                      </button>
                    ))}
                  </div>

                  <button 
                    onClick={runSimulation}
                    className="w-full py-3 bg-meta hover:bg-meta-dark text-white font-bold text-sm rounded-xl shadow-md transition-all flex items-center justify-center gap-2"
                  >
                    <i className="fa-solid fa-bolt"></i>
                    <span>{isBn ? 'টেস্ট ইভেন্ট পাঠান ও অটো-রিপ্লাই দেখুন' : 'Trigger Simulation Event'}</span>
                  </button>

                  {/* Result Box */}
                  {simResult && (
                    <div className="mt-6 p-5 rounded-2xl bg-slate-900 text-white space-y-4">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                        <div className="flex items-center space-x-2">
                          <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                          <span className="font-bold text-sm text-emerald-400">Status 200 OK — Rule Matched: {simResult.rule}</span>
                        </div>
                        <span className="text-xs text-slate-400 font-mono">180ms Latency</span>
                      </div>

                      <div>
                        <p className="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">স্বয়ংক্রিয় প্রেরিত উত্তর (Auto-Reply Response):</p>
                        <div className="p-3 bg-slate-800/90 rounded-xl text-xs sm:text-sm text-slate-100 whitespace-pre-line border border-slate-700">
                          {simResult.reply}
                        </div>
                      </div>

                      <div>
                        <p className="text-xs text-slate-400 font-mono mb-1">{simResult.endpoint}</p>
                        <pre className="p-3 bg-black/50 rounded-xl text-[11px] font-mono text-emerald-300 overflow-x-auto code-scroll border border-slate-800">
                          {simResult.payload}
                        </pre>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* 6. META PRODUCTS: LOGIN & WEBHOOKS */}
            {activeTab === 'meta-products' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-6">
                  <div>
                    <h3 className="text-lg font-bold text-slate-900">{isBn ? 'মেটা ডেভেলপার প্রোডাক্ট কনফিগারেশন' : 'Meta Developer Products Configuration'}</h3>
                    <p className="text-xs text-slate-500">{isBn ? 'developers.facebook.com এ আপনার অ্যাপের ভেতর Facebook Login for Business এবং Webhooks প্রোডাক্ট দুটি কনফিগার করুন।' : 'Configure Facebook Login for Business and Webhooks products.'}</p>
                  </div>

                  {/* Product 1: Facebook Login for Business */}
                  <div className="p-5 rounded-2xl border border-blue-200 bg-blue-50/40 space-y-3">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center space-x-3">
                        <div className="w-10 h-10 rounded-xl bg-meta text-white flex items-center justify-center font-bold">
                          <i className="fa-solid fa-right-to-bracket"></i>
                        </div>
                        <div>
                          <h4 className="font-bold text-slate-900 text-sm">1. Facebook Login for Business</h4>
                          <p className="text-xs text-slate-500">Official OAuth 2.0 Client Authentication</p>
                        </div>
                      </div>
                      <span className="px-2.5 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-lg flex items-center gap-1">
                        <i className="fa-solid fa-check"></i> Active & Configured
                      </span>
                    </div>

                    <div className="bg-white p-3.5 rounded-xl border border-blue-100 space-y-2">
                      <label className="block text-xs font-bold text-slate-700">Valid OAuth Redirect URIs (মেটা কনসোলে বসান):</label>
                      <div className="flex items-center gap-2">
                        <input 
                          type="text" 
                          readOnly 
                          value={redirectUri} 
                          className="flex-1 text-xs font-mono p-2.5 rounded-lg bg-slate-50 border border-slate-200 text-slate-800"
                        />
                        <button 
                          onClick={() => { navigator.clipboard.writeText(redirectUri); alert('Redirect URI কপি হয়েছে!'); }} 
                          className="px-3 py-2 bg-meta text-white text-xs font-bold rounded-lg shrink-0"
                        >
                          কপি করুন
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Product 2: Webhooks */}
                  <div className="p-5 rounded-2xl border border-teal-200 bg-teal-50/40 space-y-4">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center space-x-3">
                        <div className="w-10 h-10 rounded-xl bg-tealAccent text-white flex items-center justify-center font-bold">
                          <i className="fa-solid fa-webhook"></i>
                        </div>
                        <div>
                          <h4 className="font-bold text-slate-900 text-sm">2. Webhooks (Page Object)</h4>
                          <p className="text-xs text-slate-500">Live Real-time Messenger & Comment Ingestion</p>
                        </div>
                      </div>
                      <span className="px-2.5 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-lg flex items-center gap-1">
                        <i className="fa-solid fa-check"></i> Subscribed & Verified
                      </span>
                    </div>

                    <div className="bg-white p-3.5 rounded-xl border border-teal-100 space-y-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Callback URL (Webhook Endpoint):</label>
                        <div className="flex items-center gap-2">
                          <input 
                            type="text" 
                            readOnly 
                            value={webhookUrl} 
                            className="flex-1 text-xs font-mono p-2.5 rounded-lg bg-slate-50 border border-slate-200 text-slate-800"
                          />
                          <button 
                            onClick={() => { navigator.clipboard.writeText(webhookUrl); alert('Callback URL কপি হয়েছে!'); }} 
                            className="px-3 py-2 bg-teal-600 text-white text-xs font-bold rounded-lg shrink-0"
                          >
                            কপি করুন
                          </button>
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Verify Token (hub.verify_token):</label>
                        <div className="flex items-center gap-2">
                          <input 
                            type="text" 
                            readOnly 
                            value={verifyToken} 
                            className="flex-1 text-xs font-mono p-2.5 rounded-lg bg-slate-50 border border-slate-200 text-slate-800"
                          />
                          <button 
                            onClick={() => { navigator.clipboard.writeText(verifyToken); alert('Verify Token কপি হয়েছে!'); }} 
                            className="px-3 py-2 bg-teal-600 text-white text-xs font-bold rounded-lg shrink-0"
                          >
                            কপি করুন
                          </button>
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1.5">Subscribed Page Fields:</label>
                        <div className="flex flex-wrap gap-2">
                          {['messages (ইনবক্স মেসেজ)', 'messaging_postbacks (বাটন ক্লিক)', 'feed (পোস্ট কমেন্ট ও রিয়্যাকশন)'].map(f => (
                            <span key={f} className="text-xs bg-emerald-50 text-emerald-800 border border-emerald-200 px-2.5 py-1 rounded-md font-bold flex items-center gap-1">
                              <i className="fa-solid fa-check text-xs"></i> {f}
                            </span>
                          ))}
                        </div>
                      </div>

                      <div className="pt-2">
                        <button 
                          onClick={testHandshake}
                          className="w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-2"
                        >
                          <i className="fa-solid fa-network-wired"></i>
                          <span>{isBn ? 'টেস্ট মেটা হ্যান্ডশেক পিং পাঠান (Test Handshake)' : 'Test Meta Webhook Handshake'}</span>
                        </button>
                        {handshakeMessage && (
                          <div className="mt-2.5 p-2.5 bg-emerald-100 text-emerald-900 rounded-lg text-xs font-semibold flex items-center gap-2">
                            <i className="fa-solid fa-circle-check text-emerald-600"></i>
                            <span>{handshakeMessage}</span>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 7. CODE EXPORT & DEPLOYMENT */}
            {activeTab === 'code-export' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="text-lg font-bold text-slate-900">Cloudflare Worker & Serverless Webhook Handler</h3>
                      <p className="text-xs text-slate-500">GET Verification + POST Messenger & Comment Automation Handler</p>
                    </div>
                    <button 
                      onClick={() => {
                        const code = `export default {\n  async fetch(req, env) {\n    const url = new URL(req.url);\n    if (req.method === "GET") {\n      if (url.searchParams.get("hub.verify_token") === env.VERIFY_TOKEN) {\n        return new Response(url.searchParams.get("hub.challenge"), { status: 200 });\n      }\n    }\n    return new Response("OK");\n  }\n};`;
                        navigator.clipboard.writeText(code);
                        alert('Cloudflare Worker কোড কপি হয়েছে!');
                      }}
                      className="px-3 py-1.5 bg-meta text-white rounded-lg text-xs font-bold"
                    >
                      কপি করুন
                    </button>
                  </div>

                  <pre className="p-4 bg-slate-900 text-slate-200 rounded-xl text-xs font-mono overflow-x-auto code-scroll">
{`// CLOUDFLARE WORKER / VERCEL SERVERLESS WEBHOOK HANDLER
export default {
  async fetch(request, env) {
    const url = new URL(request.url);

    // 1. Meta Webhook GET Handshake
    if (request.method === "GET") {
      const mode = url.searchParams.get("hub.mode");
      const token = url.searchParams.get("hub.verify_token");
      const challenge = url.searchParams.get("hub.challenge");

      if (mode === "subscribe" && token === env.META_VERIFY_TOKEN) {
        return new Response(challenge, { status: 200 });
      }
      return new Response("Forbidden", { status: 403 });
    }

    // 2. Meta Webhook POST Event Receiver
    if (request.method === "POST") {
      const payload = await request.json();
      if (payload.object === "page") {
        for (const entry of payload.entry) {
          // Process Messages
          if (entry.messaging) {
            for (const msg of entry.messaging) {
              if (msg.message && !msg.message.is_echo) {
                await replyMessenger(msg.sender.id, msg.message.text, env.PAGE_ACCESS_TOKEN);
              }
            }
          }
          // Process Comments
          if (entry.changes) {
            for (const change of entry.changes) {
              if (change.field === "feed" && change.value.item === "comment" && change.value.verb === "add") {
                await replyComment(change.value.comment_id, env.PAGE_ACCESS_TOKEN);
              }
            }
          }
        }
        return new Response("EVENT_RECEIVED", { status: 200 });
      }
    }
    return new Response("OK", { status: 200 });
  }
};`}
                  </pre>
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
            <p className="font-semibold text-slate-700">Masum Auto Reply (মাছুম অটো রিপ্লাই) — Official Meta Graph API Automation Hub</p>
            <p className="mt-1">Powered by React, Tailwind CSS, Meta Graph API v21.0 & Supabase PostgreSQL</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
